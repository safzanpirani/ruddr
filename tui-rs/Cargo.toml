[package]
name = "ruddr-tui"
version = "0.1.0"
edition = "2021"
description = "Experimental ratatui front end for Ruddr"
license = "MIT"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
