name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

# One tag pushed once has delivered two identical push events, and the loser
# of the resulting race fails on npm after the winner has already published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: darwin, goarch: arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { goos: darwin, goarch: amd64, target: x86_64-apple-darwin, runner: macos-latest }
          # musl gives fully static Linux binaries, like the Go builds were.
          - { goos: linux, goarch: amd64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { goos: windows, goarch: amd64, target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p ruddr-cli --target ${{ matrix.target }}
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ruddr$ext" "dist/ruddr-${{ matrix.goos }}-${{ matrix.goarch }}$ext"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          "dist/ruddr-${{ matrix.goos }}-${{ matrix.goarch }}$ext" version
      - uses: actions/upload-artifact@v4
        with:
          name: ruddr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify the tag matches the declared versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)
          npm_version=$(node -p 'require("./package.json").version')
          test "$tag" = "$cargo_version" || { echo "tag v$tag does not match Cargo.toml version $cargo_version"; exit 1; }
          test "$tag" = "$npm_version" || { echo "tag v$tag does not match package.json version $npm_version"; exit 1; }
      - name: Test
        run: cargo test --workspace --locked
      - name: Checksums
        run: |
          cd dist
          sha256sum ruddr-* > checksums.txt
          cat checksums.txt
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ruddr-*
            dist/checksums.txt
          generate_release_notes: true
      - name: Prepare npm package
        run: node scripts/npm-prepare.cjs "${GITHUB_REF_NAME#v}" dist/checksums.txt
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "ruddr@$version" version >/dev/null 2>&1; then
            echo "ruddr@$version is already on npm; nothing to publish"
            exit 0
          fi
          npm pack --dry-run
          npm publish --access public --provenance
